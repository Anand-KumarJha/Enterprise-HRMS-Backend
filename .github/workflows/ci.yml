name: HRMS CI Pipeline

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./enterprise-hrms

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: maven
          cache-dependency-path: enterprise-hrms/pom.xml

      - name: Give Maven Wrapper Permission
        run: chmod +x ./mvnw

      - name: Build and Run Tests
        run: ./mvnw clean verify